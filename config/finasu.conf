# ============================================================
#  FinaSU / FinaSU 版本绑定表（内核侧必须与管理器严格配对）
# ------------------------------------------------------------
#  管理器 APK 的 versionCode  ==  内核侧 KSU_VERSION (=30000 + FinaSU 仓库提交数)
#  管理器 APK 的 UAPI 期望值  ==  内核侧 uapi/supercall.h 的 KERNEL_SU_UAPI_VERSION
#  管理器 APK 的签名证书      ==  内核里编译进去的 KSU_EXPECTED_SIZE / KSU_EXPECTED_HASH
#  三者任一不符，管理器就会显示「未安装内核」，或必须手动授权 dynamic manager。
#
#  这里全部用 `: "${VAR:=默认值}"` 写法：命令行 / CI 传入的环境变量优先级更高。
# ============================================================

# 管理器源码仓库（FinaSU 已改名 FinaSU；GitHub 上 LyraVoid/FinaSU 会 301 跳转）
: "${FINASU_REPO:=https://github.com/LyraVoid/FinaSU.git}"

# 与管理器版本配套的 tag
: "${FINASU_TAG:=v1.0.4}"

# 目标管理器 APK：FinaSU_v1.0.4_32960-release.apk
: "${FINASU_MANAGER_VERSION:=32960}"
: "${FINASU_UAPI:=6}"

# 该 APK 的 v2 签名证书（DER）长度与 SHA-256 —— scripts/apk_cert.py 实测值
: "${FINASU_CERT_SIZE:=0x103}"
: "${FINASU_CERT_HASH:=f7cecef261a422eb70f7cb63272ec28c28c2b29856e51ba5ad229935ddc1d833}"

# 已知对应关系（换版本时把上面四项一起改；给了 MANAGER_APK 时签名可自动反推）
#   v0.1.0-beta3  32787  UAPI 5   旧 FinaSU 时代
#   v1.0.0        -      UAPI 5/6
#   v1.0.3        -      UAPI 6
#   v1.0.4        32960  UAPI 6   ← 当前默认
