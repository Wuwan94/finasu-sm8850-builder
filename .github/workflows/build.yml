name: Build SM8850 Kernel (FinaSU)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核基线（决定刷哪些机型，选错会开不了机）'
        required: true
        type: choice
        default: '6.12.23'
        options:
          - '6.12.23'   # 一加 15 源码基线，OKI
          - '6.12.38'   # 一加 Ace 6T 源码基线
          - '6.12.58'   # Pad 3 Pro 源码基线
          - '6.12.69-gki'
      finasu_tag:
        description: 'FinaSU 源码 tag（要与管理器版本配套）'
        required: true
        type: string
        default: 'v1.0.4'
      finasu_version:
        description: '管理器 versionCode（必须等于 30000 + 该 tag 的提交数）'
        required: true
        type: string
        default: '32960'
      manager_apk_url:
        description: '可选：管理器 APK 直链，填了就从 APK 实测签名并核对版本号'
        required: false
        type: string
        default: ''
      kernel_suffix:
        description: '内核后缀（留空用该基线默认值，开头不加连字符）'
        required: false
        type: string
        default: ''
      susfs_enable:
        description: '是否开启 SUSFS（内核级隐藏；需要内置 FinaSU，会调用 scripts/finasu_compat 的源码级适配）'
        required: true
        type: boolean
        default: false
      builtin_ksu:
        description: '把 FinaSU 编译进内核（关闭则给 init_boot 里 kernelsu.ko 的 LKM 模式用；刷过 LKM root 的机器请选 false）'
        required: true
        type: boolean
        default: true
      kpm:
        description: '叠加 KPatch-Next 的独立 KPM 实现'
        required: true
        type: boolean
        default: false
      lz4:
        description: 'lz4 1.10.0 + zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd:
        description: 'LZ4KD 补丁（与 lz4/zstd 二选一即可）'
        required: true
        type: boolean
        default: false
      bbr:
        description: 'BBR 等拥塞控制算法'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - 'default'
      droidspaces:
        description: 'Droidspaces 容器支持'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - 'standard'
          - 'extend'
      better_net:
        description: 'netfilter/ipset 增强配置'
        required: true
        type: boolean
        default: false
      adios:
        description: 'ADIOS IO 调度器'
        required: true
        type: boolean
        default: true
      rekernel:
        description: 'Re:Kernel 支持'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: 'Baseband-guard 内核级防格机'
        required: true
        type: boolean
        default: true
      release:
        description: '构建完成后发布到 Release'
        required: true
        type: boolean
        default: false

concurrency:
  # 同一套参数重复触发时自动取消旧 run（分组带上各开关，A/B 两种变体互不影响）
  group: build-${{ inputs.kernel_version }}-${{ inputs.builtin_ksu }}-${{ inputs.susfs_enable }}-${{ inputs.adios }}-${{ inputs.baseband_guard }}-${{ inputs.lz4 }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # 6.12 的 gendwarfksyms 需要 elfutils(libdw) >= 0.188 才能解析 DWARF5 行表；
    # ubuntu-22.04 自带 0.186，会报 `invalid .debug_line section`，所以用 24.04（0.190）
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.kernel_version }}-${{ hashFiles('config/finasu.conf', 'scripts/build.sh') }}
          restore-keys: |
            ccache-${{ inputs.kernel_version }}-

      - name: 腾出磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 下载管理器 APK（可选）
        if: inputs.manager_apk_url != ''
        run: |
          curl -fL --retry 3 -o manager.apk "${{ inputs.manager_apk_url }}"
          python3 scripts/apk_cert.py manager.apk

      - name: 构建
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          FINASU_TAG: ${{ inputs.finasu_tag }}
          FINASU_MANAGER_VERSION: ${{ inputs.finasu_version }}
          MANAGER_APK: ${{ inputs.manager_apk_url != '' && 'manager.apk' || '' }}
          CUSTOM_SUFFIX: ${{ inputs.kernel_suffix }}
          APPLY_KSU: ${{ inputs.builtin_ksu && '1' || '0' }}
          APPLY_SUSFS: ${{ inputs.susfs_enable && '1' || '0' }}
          USE_KPM: ${{ inputs.kpm && '1' || '0' }}
          APPLY_LZ4: ${{ inputs.lz4 && '1' || '0' }}
          APPLY_LZ4KD: ${{ inputs.lz4kd && '1' || '0' }}
          APPLY_BBR: ${{ inputs.bbr }}
          APPLY_DROIDSPACES: ${{ inputs.droidspaces }}
          APPLY_BETTERNET: ${{ inputs.better_net && '1' || '0' }}
          APPLY_ADIOS: ${{ inputs.adios && '1' || '0' }}
          APPLY_REKERNEL: ${{ inputs.rekernel && '1' || '0' }}
          APPLY_BBG: ${{ inputs.baseband_guard && '1' || '0' }}
          INSTALL_DEPS: '1'
          USE_CCACHE: '1'
          CCACHE_MAXSIZE: '5G'
        run: |
          # 没有 pipefail 的话 tee 会把 build.sh 的失败吞掉（第一次就踩了）
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build-full.log

      - name: 上传刷机包
        # archive: false —— 关键！默认行为会把 zip 再包一层，
        # 用户下载到的是「包含刷机包的 zip」，管理器会报 ZIP is missing root anykernel.sh
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3-FinaSU-${{ inputs.kernel_version }}
          # archive: false 只允许上传单个文件，所以这里只传 zip；
          # sha256 在 Release 资产里（同名的 .zip.sha256）
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: 上传补丁冲突记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejects-${{ github.run_number }}
          path: work/rejects
          if-no-files-found: ignore

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-full.log
          if-no-files-found: ignore

      - name: 发布 Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="finasu-${KERNEL_VERSION:-${{ inputs.kernel_version }}}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --title "FinaSU ${{ inputs.finasu_tag }} / kernel ${{ inputs.kernel_version }}" \
            --notes "管理器版本号必须是 ${{ inputs.finasu_version }}（UAPI 见 config/finasu.conf）。刷入前请确认机型与内核基线匹配。"
